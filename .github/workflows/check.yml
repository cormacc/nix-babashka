name: check

on:
  push:
    branches:
      - main
    paths:
      - flake.nix
      - flake.lock
      - nix/**
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - nix/**

permissions:
  contents: read

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Cache Nix builds
        uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Check flake
        run: nix flake check
